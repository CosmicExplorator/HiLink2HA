name: Python

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: python -m pip install pytest ruff
      - name: Lint
        run: ruff check custom_components tests
      - name: Compile integration
        run: python -m compileall -q custom_components/huawei_sms
      - name: Run unit tests
        run: pytest -q
